name: Build Custom Telegram Windows (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  UPLOAD_ARTIFACT: "true"
  ONLY_CACHE: "false"

defaults:
  run:
    shell: cmd

jobs:
  windows:
    name: Build Telegram (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Maximize Runner Disk Space
        shell: pwsh
        run: |
          Write-Host "Free disk space before cleanup:"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Select-Object Name, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB, 2)}}
          
          # Remove heavy preinstalled runtimes and SDKs not used for C++ MSVC builds
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Ruby" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\go" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\SeleniumWebDrivers" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MongoDB" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\MySQL" -ErrorAction SilentlyContinue
          
          Write-Host "Free disk space after cleanup:"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Select-Object Name, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB, 2)}}

      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Patch CMake MSVC Debug Flags
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake || true

      - name: Checkout Custom Codebase
        uses: actions/checkout@v4
        with:
          path: custom_src

      - name: Clone Official TDesktop with Submodules
        run: |
          git clone --depth 1 --branch v7.0.9 --recurse-submodules https://github.com/telegramdesktop/tdesktop.git %TBUILD%\TelegramCustom

      - name: Apply Custom Modifications
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE\custom_src"
          $dst = "$env:TBUILD\TelegramCustom"
          
          Copy-Item -Recurse -Force "$src\Telegram\SourceFiles\custom_features" "$dst\Telegram\SourceFiles\"
          Copy-Item -Force "$src\Telegram\SourceFiles\settings\sections\settings_custom.h" "$dst\Telegram\SourceFiles\settings\sections\"
          Copy-Item -Force "$src\Telegram\SourceFiles\settings\sections\settings_custom.cpp" "$dst\Telegram\SourceFiles\settings\sections\"
          Copy-Item -Force "$src\Telegram\SourceFiles\settings\sections\settings_main.cpp" "$dst\Telegram\SourceFiles\settings\sections\"
          Copy-Item -Force "$src\Telegram\SourceFiles\chat_helpers\stickers_list_widget.cpp" "$dst\Telegram\SourceFiles\chat_helpers\"
          Copy-Item -Force "$src\Telegram\SourceFiles\core\click_handler_types.cpp" "$dst\Telegram\SourceFiles\core\"
          Copy-Item -Force "$src\Telegram\build\prepare\prepare.py" "$dst\Telegram\build\prepare\"
          Copy-Item -Force "$src\Telegram\CMakeLists.txt" "$dst\Telegram\"
          
          # Delete custom_src to save disk space
          Remove-Item -Recurse -Force $src -ErrorAction SilentlyContinue
          Write-Host "[✓] Custom modifications applied and temp files cleaned!"

      - name: Setup MSVC
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Prepare Third-Party Libraries
        run: |
          %TBUILD%\TelegramCustom\Telegram\build\prepare\win.bat skip-release silent

      - name: Free Library Build Artifacts Space
        shell: bash
        run: |
          echo "Cleaning intermediate build files from Libraries..."
          find "$LibrariesPath" '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete || true

      - name: Build Telegram Desktop
        run: |
          cd %TBUILD%\TelegramCustom\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=17349 ^
          -D TDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D CMAKE_CXX_FLAGS="/FS" ^
          -D CMAKE_C_FLAGS="/FS" ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Debug --parallel

      - name: Prepare Artifact
        run: |
          set OUT=%TBUILD%\TelegramCustom\out\Debug
          mkdir %GITHUB_WORKSPACE%\artifact
          copy "%OUT%\Telegram.exe" "%GITHUB_WORKSPACE%\artifact\"
          copy "%OUT%\Updater.exe" "%GITHUB_WORKSPACE%\artifact\" || exit 0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCustom-Windows-x64
          path: artifact\
