name: Build Custom Telegram Windows (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  UPLOAD_ARTIFACT: "true"
  ONLY_CACHE: "false"
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

defaults:
  run:
    shell: cmd

jobs:
  windows:
    name: Build Telegram (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Prepare directories
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Fetch Submodules
        shell: pwsh
        run: |
          $repoPath = Join-Path $env:TBUILD $env:REPO_NAME
          Set-Location $repoPath
          
          $modules = Get-Content .gitmodules
          $currentPath = ""
          foreach ($line in $modules) {
              if ($line -match "path\s*=\s*(.*)") {
                  $currentPath = $matches[1].Trim()
              } elseif ($line -match "url\s*=\s*(.*)") {
                  $url = $matches[1].Trim()
                  if ($currentPath -and -not (Test-Path "$currentPath\CMakeLists.txt" -PathType Leaf) -and -not (Test-Path "$currentPath\run_cmake.py" -PathType Leaf)) {
                      Write-Host "Cloning submodule $currentPath from $url..."
                      Remove-Item -Recurse -Force $currentPath -ErrorAction SilentlyContinue
                      git clone --depth 1 $url $currentPath
                  }
                  $currentPath = ""
              }
          }

      - name: Setup MSVC
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          toolset: '14.44'

      - name: NuGet sources
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Prepare Third-Party Libraries
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat skip-release silent

      - name: Build Telegram Desktop
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_ID=17349 ^
          -D TDESKTOP_API_HASH=344583e45741c457fe1862106095a5eb ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Debug --parallel

      - name: Prepare Artifact
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Debug
          mkdir %GITHUB_WORKSPACE%\artifact
          copy "%OUT%\Telegram.exe" "%GITHUB_WORKSPACE%\artifact\"
          copy "%OUT%\Updater.exe" "%GITHUB_WORKSPACE%\artifact\" || exit 0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramCustom-Windows-x64
          path: artifact\
